function profile(){

 <div class="ao-profile-stats"><div class="ao-stat"><b>${items.length}</b><small>衣橱单品</small></div><div class="ao-stat"><b>${S.saved.length}</b><small>收藏穿搭</small></div><div class="ao-stat"><b>${S.preferences.length}</b><small>偏好风格</small></div></div>
 <div class="ao-section-head"><h2>偏好与设置</h2></div>
 ${[["✦","我的风格偏好","preferences"],["◎","新手引导预览","welcome"],["⚿","模拟登录流程","login"],["◈","隐私与数据说明","privacy"]].map(([i,t,p])=>`<button class="ao-menuitem" data-action="nav" data-page="${p}"><span style="font-size:19px;color:#bb7066">${i}</span><span>${t}</span><span class="arr">›</span></button>`).join("")}

function preferences(){

 <div class="ao-section-head"><h2>你喜欢哪些风格？</h2></div><div class="ao-tagpick">${styles.map(x=>`<button style="padding:14px 16px;font-size:13px" class="ao-tag ${S.preferences.includes(x.id)?"active":""}" data-action="pref" data-style="${x.id}">${x.label}</button>`).join("")}</div>

function privacy(){
 return `${routebar("隐私与数据")}<div class="ao-content"><h1 class="ao-h1">让衣橱只属于你</h1><p class="ao-sub">以下是正式产品应具备的数据处理原则。</p>
 ${[["图片数据","用户上传的衣服照片应当加密传输、隔离存储，并支持删除。"],["第三方 AI","需要告知所调用服务的用途、数据类型以及相应处理规则。"],["商品链接","仅在平台许可范围内处理商品信息，失败时提供图片上传兜底。"],["账号与注销","正式产品应提供完整的账号安全、数据导出或删除与注销流程。"]].map(a=>`<div style="padding:16px 0;border-bottom:1px solid #eee5db"><b style="font-size:14px">${a[0]}</b><p class="ao-small-muted">${a[1]}</p></div>`).join("")}<div class="ao-tip">当前文件为离线交互演示，没有真实登录、云端存储或 AI 请求。</div></div>`;
}
function welcome(){
 return `<div class="ao-welcome"><div style="align-self:flex-start;font-weight:850;font-size:18px">衣橱<span style="color:#bb7066">·</span>灵感</div>
 <div class="ao-welcome-art">${avatarSvg({top:"t3",bottom:"b3",shoes:"s1",outer:"o1",hat:null,dress:null})}</div>
 <span class="ao-overline">AN OUTFIT A DAY</span><h2>穿你拥有的，<br/>搭你喜欢的。</h2><p>导入自己的衣服，选择喜欢的风格。<br/>用一个小小的 2D 人物，把灵感穿出来。</p>
 <div class="ao-actions" style="width:100%;margin-top:auto">${btn("直接体验演示衣橱","gohome","","ao-primary")}</div>${btn("模拟登录 / 注册","nav", 'data-page="login"')}</div>`;
}
function login(){
 return `${routebar("登录 / 注册")}<div class="ao-content"><div class="ao-spacer"></div><span class="ao-overline">WELCOME BACK</span><h1 class="ao-h1">把每一天的穿搭<br/>都收进衣橱。</h1><p class="ao-sub">演示版提供页面和输入体验，不发送短信。</p>
 <div class="ao-form" style="margin-top:34px"><div class="ao-field"><label>手机号码</label><input data-bind="phone" inputmode="tel" placeholder="请输入手机号（演示）" value="${esc(S.phone)}"/></div><div class="ao-field"><label>验证码</label><input placeholder="演示版无需真实验证码" inputmode="numeric"/></div>
 ${btn("进入演示衣橱","gohome","","ao-primary")}</div><div class="ao-tip">正式版需要接入合规的认证服务，并处理验证码频控、异常登录和账号注销。</div></div>`;
}
function candidateMatches(o){
 return Object.entries(S.locked).every(([k,v])=>!v||!S.outfit[k]||o[k]===S.outfit[k]);
}
function evalScore(o){
 const keys=Object.values(o).filter(Boolean).map(find).filter(Boolean);
 let v=keys.reduce((n,x)=>n+(x.tags.includes(S.style)?6:0),0);
 v+=o.outer?0.5:1;
 const colors=new Set(keys.filter(x=>x.category!=="hat").map(x=>x.color));
 v+=Math.max(0,4-colors.size)*1.1;
 if(o.top==="t1"&&o.bottom==="b1")v+=.2;
 if(S.style==="commute"&&o.shoes==="s2")v+=3;
 if(S.style==="sport"&&o.shoes==="s4")v+=3;
 if(S.style==="retro"&&o.shoes==="s3")v+=3;
 return v;
}
function computeRecommendations(){
 const sets=[],tops=items.filter(x=>x.category==="top"),bots=items.filter(x=>x.category==="bottom"),
 shoes=items.filter(x=>x.category==="shoes"), dresses=items.filter(x=>x.category==="dress"),
 outerOptions=[null,...items.filter(x=>x.category==="outer").map(x=>x.id)];
 const hatValue=S.locked.hat?S.outfit.hat:null;
 for(const t of tops)for(const b of bots)for(const s of shoes)for(const o of outerOptions){
  const candidate={...EMPTY,top:t.id,bottom:b.id,shoes:s.id,outer:o,hat:hatValue};
  if(candidateMatches(candidate))sets.push({candidate,score:evalScore(candidate)});
 }
 for(const d of dresses)for(const s of shoes)for(const o of outerOptions){
  const candidate={...EMPTY,dress:d.id,shoes:s.id,outer:o,hat:hatValue};
  if(candidateMatches(candidate))sets.push({candidate,score:evalScore(candidate)});
 }
 sets.sort((a,b)=>b.score-a.score);
 const picked=[];
 for(const x of sets){
  if(picked.length===3)break;
  const diff=o=>Object.keys(EMPTY).filter(k=>o[k]!==x.candidate[k]).length;
  if(picked.every(y=>diff(y)>=2))picked.push(x.candidate);
 }
 if(picked.length<3)for(const x of sets){if(picked.length===3)break;if(!picked.some(y=>JSON.stringify(y)===JSON.stringify(x.candidate)))picked.push(x.candidate)}
 S.recs=picked;S.recoIndex=0;
 if(picked[0]) S.outfit={...picked[0]};
}
function recoReason(o){
 const i=find(o.top||o.dress),b=find(o.bottom),s=find(o.shoes);
 return `${styleName(S.style)}搭配建议：${i?.name||"连衣裙"}${b?" + "+b.name:""}${s?" + "+s.name:""}。优先从你已有的衣服中寻找颜色与风格协调的组合。`;
}
function complete(o){return !!o.shoes&&(!!o.dress||!!(o.top&&o.bottom))}
function picker(slot){
 S.modal={type:"picker",slot};draw();
}
function pickerSheet(){
 const m=S.modal; const slot=m.slot; const arr=items.filter(x=>x.category===slot);
 return `<div class="ao-overlay" data-action="closeOverlay"><div class="ao-sheet" data-stop="true"><div class="ao-sheet-handle"></div>
 <div class="ao-sheet-head"><div><h3>选择${nameSlot[slot]}</h3><p class="ao-small-muted" style="margin:5px 0 0">从你已拥有的服装中选择</p></div><button class="ao-iconbtn" data-action="close">×</button></div>
 <div class="ao-sheet-grid">${arr.map(i=>`<button class="ao-gcard" data-action="pickitem" data-slot="${slot}" data-id="${i.id}" style="${S.outfit[slot]===i.id?"border-color:#bb7066":""}"><div class="ao-gimg">${pct(i)}</div><div class="name">${esc(i.name)}</div><div class="meta">${S.outfit[slot]===i.id?"✓ 当前穿着":"点击试穿"}</div></button>`).join("")}</div>
 <div class="ao-actions">${btn("移除这个位置的单品","remove",'data-slot="'+slot+'"')}${btn("＋ 添加新衣服","toimport","","ao-primary")}</div></div></div>`;
}
function confirmSheet(){
 const id=S.modal?.id,d=find(id);
 return `<div class="ao-overlay" data-action="closeOverlay"><div class="ao-sheet" data-stop="true"><div class="ao-sheet-handle"></div><h3>确认删除吗？</h3><p class="ao-small-muted">删除「${esc(d?.name||"这件衣服")}」后，包含该衣服的收藏套装将显示缺失状态。此操作在演示版中不可撤销。</p><div class="ao-actions">${btn("取消","close")}${btn("确认删除","confirmdelete","","ao-primary")}</div></div></div>`;
}
function modalHtml(){return S.modal?(S.modal.type==="picker"?pickerSheet():confirmSheet()):""}
function renderAside(){
 const links=[["home","首页 · 2D 换装"],["wardrobe","数字衣橱"],["importChoice","服装导入流程"],["saved","搭配收藏"],["profile","个人中心"],["welcome","新手欢迎页"],["preferences","风格偏好"]];
 return `<aside class="ao-aside"><div class="ao-identity"><span class="ao-brandmark">✦</span><div><div style="font-size:15px;font-weight:850">衣橱 · 灵感</div><div class="ao-overline">OUTFIT LAB / MVP</div></div></div>
 <div class="ao-overline">INTERACTIVE PROTOTYPE</div><h1>每一件旧衣服，<br/>都有新的可能。</h1><p>一个以个人衣橱为中心的 AI 穿搭应用。右侧为可点击的移动端流程原型，支持真实页面跳转、2D 人物换装、切换风格、推荐与收藏。</p>
 <div class="ao-side-label">页面快速导航</div>
 ${links.map(([id,label],idx)=>`<button class="ao-side-link ${S.page===id?"active":""}" data-action="nav" data-page="${id}"><span class="n">0${idx+1}</span><span>${label}</span><span style="margin-left:auto">↗</span></button>`).join("")}
 <div class="ao-side-note"><b style="color:#6a5a4d">演示数据说明</b><br/>预置 ${items.length} 件示例服装。图片、分类、穿搭推荐及登录均为本地模拟，不会调用外部 AI 或电商接口。上传本地图片可体验录入页面。</div></aside>`;
}
function renderPage(){
 switch(S.page){
 case"welcome":return welcome();case"login":return login();case"home":return home();case"wardrobe":return wardrobe();
 case"importChoice":return importChoice();case"importImage":return importImage();case"importLink":return importLink();
 case"edit":return editPage();case"detail":return detailPage();case"saved":return savedPage();
 case"savedDetail":return savedDetail();case"profile":return profile();case"preferences":return preferences();
 case"privacy":return privacy();default:return home();
 }
}
function draw(){
 const previousScroll=root.querySelector(".ao-scroll")?.scrollTop||0;
 const main=renderPage(),isMain=["home","wardrobe","saved","profile"].includes(S.page);
 root.innerHTML=`${renderAside()}<div class="ao-phone"><div class="ao-status"><span>9:41</span><span>●●● ▰</span></div><main class="ao-scroll">${main}</main>${isMain?mainTabs():""}${modalHtml()}${S.toast?`<div class="ao-toast" role="status">${esc(S.toast)}</div>`:""}</div>`;
 const currentScroll=root.querySelector(".ao-scroll");if(currentScroll)currentScroll.scrollTop=previousScroll;
}
function selectItem(slot,id){
 if(slot==="dress"){S.outfit.top=null;S.outfit.bottom=null;S.locked.top=false;S.locked.bottom=false;}
 if(slot==="top"||slot==="bottom"){S.outfit.dress=null;S.locked.dress=false;}
 S.outfit[slot]=id;S.locked[slot]=true;S.recs=[];S.recoIndex=0;S.modal=null;
 draw();
}
function startDraft(demo,source=""){
 S.editId=null;S.draft={name:demo?"米白色新单品":"新导入的服装",category:"top",sub:"衬衫",color:"#F0ECE4",tags:["minimal"],season:["春","秋"],fit:"常规",img:null,demo:!!demo,source};
 setPage("edit");
}
function saveGarment(){
 const d=S.draft;
 if(!d?.name?.trim())return flash("请填写服装名称");
 if(!d?.category)return flash("请选择服装类别");
 if(!d?.img&&!d.demo)return flash("请上传图片或使用演示素材");
 if(S.editId){
  const i=find(S.editId);if(i)Object.assign(i,{name:d.name.trim(),category:d.category,sub:d.sub||catName(d.category),color:d.color,tags:[...d.tags],season:[...d.season],fit:d.fit,img:d.img||i.img,source:d.source});
  S.detailId=S.editId;S.editId=null;S.draft=null;setPage("detail");flash("服装信息已更新");
 }else{
  items.unshift({id:"u"+Date.now(),name:d.name.trim(),category:d.category,sub:d.sub||catName(d.category),color:d.color,tags:[...d.tags],season:[...d.season],fit:d.fit,img:d.img||null,source:d.source});
  S.category="all";S.query="";S.draft=null;setPage("wardrobe");flash("新衣服已加入演示衣橱");
 }
}
function togg(a,val){const pos=a.indexOf(val);pos>=0?a.splice(pos,1):a.push(val)}
root.addEventListener("click",(ev)=>{
 const b=ev.target.closest("[data-action]");if(!b||!root.contains(b))return;
 if(b.dataset.action==="closeOverlay"&&ev.target.closest("[data-stop]"))return;
 const a=b.dataset.action,id=b.dataset.id,slot=b.dataset.slot,page=b.dataset.page;
 switch(a){
 case"nav":setPage(page);break;
 case"openPhoto":S.capture=b.dataset.mode==="camera";setPage("importImage");break;
 case"back":back();break;
 case"gohome":setPage("home");break;
 case"picker":picker(slot);break;
 case"pickitem":selectItem(slot,id);break;
 case"close":case"closeOverlay":S.modal=null;draw();break;
 case"remove":
  S.outfit[slot]=null;S.locked[slot]=false;S.recs=[];S.modal=null;draw();break;
 case"lock":
  if(!S.outfit[slot])return flash("先选择一件"+nameSlot[slot]);
  S.locked[slot]=!S.locked[slot];draw();break;
 case"style":S.style=b.dataset.style;S.recs=[];draw();break;
 case"recommend":
  computeRecommendations();if(!S.recs.length)return flash("衣服不足，暂时无法组成完整搭配");
  flash("已从个人衣橱生成搭配");root.querySelector(".ao-reco")?.scrollIntoView({behavior:"smooth",block:"nearest"});break;
 case"nextrec":
  if(!S.recs.length)computeRecommendations();
  else S.recoIndex=(S.recoIndex+1)%S.recs.length;
  if(S.recs.length)S.outfit={...S.recs[S.recoIndex]};
  draw();break;
 case"save":
  if(!complete(S.outfit))return flash("请先选好上装、下装和鞋子（或连衣裙与鞋子）");
  if(S.saved.some(x=>x.style===S.style&&JSON.stringify(x.pieces)===JSON.stringify(S.outfit)))return flash("这套穿搭已经收藏过啦");
  S.saved.unshift({id:"out-"+Date.now(),name:styleName(S.style)+" · 我的搭配 "+(S.saved.length+1),style:S.style,pieces:{...S.outfit},created:"刚刚保存"});
  flash("已保存到「我的穿搭」");break;
 case"clearoutfit":S.outfit={...EMPTY};S.locked=Object.fromEntries(Object.keys(EMPTY).map(k=>[k,false]));S.recs=[];draw();break;
 case"category":S.category=b.dataset.cat;draw();break;
 case"detail":S.detailId=id;setPage("detail");break;
 case"editgarment":
  {const g=find(S.detailId);if(!g)break;S.editId=g.id;S.draft={...g,tags:[...g.tags],season:[...(g.season||[])],demo:!g.img};setPage("edit");}break;
 case"usethis":
  {const g=find(S.detailId);if(!g)break;selectItem(g.category,g.id);setPage("home");}break;
 case"askdelete":S.modal={type:"confirm",id:S.detailId};draw();break;
 case"confirmdelete":{
  const did=S.modal.id,idx=items.findIndex(x=>x.id===did);if(idx>=0)items.splice(idx,1);
  for(const k of Object.keys(S.outfit))if(S.outfit[k]===did){S.outfit[k]=null;S.locked[k]=false}
  S.modal=null;setPage("wardrobe");flash("已删除服装");break;
 }
 case"demoimport":startDraft(true);break;
 case"parse":
  try{const url=new URL(S.linkInput.trim());if(!["http:","https:"].includes(url.protocol))throw Error();startDraft(false,S.linkInput.trim());}
  catch(_){flash("请输入有效的 http(s) 商品链接");}break;
 case"setcolor":if(S.draft){S.draft.color=b.dataset.color;draw()}break;
 case"tag":if(S.draft){togg(S.draft.tags,b.dataset.style);draw()}break;
 case"season":if(S.draft){togg(S.draft.season,b.dataset.season);draw()}break;
 case"reselectphoto":{const file=root.querySelector('input[data-file="edit-photo"]');if(file)file.click();else flash("请使用下方图片上传入口");}break;
 case"useDemoImage":if(S.draft){S.draft.demo=true;draw()}break;
 case"savegarment":saveGarment();break;
 case"toimport":S.modal=null;setPage("importChoice");break;
 case"saveddetail":S.savedId=id;setPage("savedDetail");break;
 case"wearSaved":{
  const s=S.saved.find(x=>x.id===S.savedId);if(!s)break;
  S.outfit={...s.pieces};for(const k of Object.keys(S.outfit))if(S.outfit[k]&&!find(S.outfit[k]))S.outfit[k]=null;
  S.style=s.style;S.locked=Object.fromEntries(Object.keys(EMPTY).map(k=>[k,false]));S.recs=[];
  setPage("home");flash("已应用收藏穿搭");break;
 }
 case"deleteSaved":S.saved=S.saved.filter(x=>x.id!==S.savedId);setPage("saved");flash("已删除收藏");break;
 case"pref":togg(S.preferences,b.dataset.style);draw();break;
 case"savepref":setPage("profile");flash("偏好已更新（仅演示）");break;
 }
});
root.addEventListener("input",ev=>{
 const el=ev.target,k=el.dataset.bind;
 if(k==="search"){S.query=el.value;const grid=root.querySelector("#ao-ward-grid"),cnt=root.querySelector("#ao-result-count");if(grid)grid.innerHTML=wardrobeGrid();if(cnt)cnt.textContent="共 "+filteredItems().length+" 件服装 · 点击查看或修改";}
 if(k==="url")S.linkInput=el.value;
 if(k==="phone")S.phone=el.value;
 if(k==="draft-name"&&S.draft)S.draft.name=el.value;
 if(k==="draft-sub"&&S.draft)S.draft.sub=el.value;
});
root.addEventListener("change",ev=>{
 const el=ev.target;
 if(el.dataset.bind==="draft-category"&&S.draft){S.draft.category=el.value;}
 if(el.dataset.file){
  const file=el.files?.[0];if(!file)return;
  if(!file.type.startsWith("image/"))return flash("请选择图片文件");
  if(file.size>10*1024*1024)return flash("图片超出 10MB 限制");
  const reader=new FileReader();
  reader.onload=()=>{
    if(S.page==="edit"&&S.draft){S.draft.img=reader.result;S.draft.demo=false;draw();}
    else{startDraft(false);S.draft.img=reader.result;draw();}
  };
  reader.readAsDataURL(file);
 }
});
draw();
})();
</script>
